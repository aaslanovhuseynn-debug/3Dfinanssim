<style>

#dtut{margin:6px auto 0;max-width:440px;background:var(--card);color:var(--fg);border:3px solid var(--ac);border-radius:14px;padding:8px 10px;font-size:13px;line-height:1.3;pointer-events:auto;display:none}

.ot{font:900 17px "Trebuchet MS",sans-serif;margin-bottom:8px}.op{margin:6px 0;color:#33475b;line-height:1.35;font-size:14px}

#jh{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0;display:none;pointer-events:none;color:#eafff0;font-family:"Trebuchet MS",system-ui,sans-serif;z-index:3}
