S.age=Math.min(was+1,50);S.en=6;S.lec=0;if(S.age<18)S.trust=Math.min(100,S.trust+5);save();hud();grow();
if(S.age>=50){ov(`<h2>Тебе 50!</h2><p>Игровая жизнь прожита. Копилка: ${S.bank} 🪙. Профессия: ${S.dip?PN[S.dip]:'нет'}.</p><button class="big" onclick="resetAll()">Начать заново</button><button class="big alt" onclick="S.age=49;save();hud();closeOv()">Ещё погулять</button>`,'mid');return}
ov(`<h2>Тебе ${S.age}!</h2><p>${EVT[S.age]||'Ещё один год. Деньги и опыт работают на тебя.'}</p>${ex?`<div class="r2"><span>Аренда и еда</span><span>−${ex} 🪙</span></div>`:''}<div class="r2"><span>Копилка</span><span>${S.bank} 🪙</span></div><button class="big" onclick="closeOv()">Дальше</button>`,'mid')}
function inter(z){if(z.st){if(z.k==='exit')return exitIn();return stMenu(z)}if(z.id==='home'||z.id==='npc')return openZone(z);enterIn(z)}
function enterIn(z){where=z.id;pl.g.position.set(INB[z.id],0,4.5);facing=0;pl.g.rotation.y=0;pop('🚪 '+z.n)}
function exitIn(){const z=Z.find(q=>q.id===where);where=null;pl.g.position.set(z.x,0,z.z+6.8);facing=Math.PI;pl.g.rotation.y=Math.PI}
function openZone(z){st='menu';const a=S.age,e=S.en,h=[`<h2>${z.n}</h2>`];
if(z.id==='home'){if(a<18)h.push(btn('Попросить у родителей','шанс зависит от доверия · 1 ⚡',"A('ask')",e<1),btn('Стащить из кошелька','+10…20 🪙, можно попасться · 1 ⚡',"A('steal')",e<1));h.push(btn('Гардероб','переодеться',"ward()"),btn('Лечь спать','закончить год',"closeOv();yearEnd()"))}
else h.push(a<18?btn('Продать «волшебный камень»','обмануть ребёнка · +8…16 🪙, 30% что раскроют · 1 ⚡',"A('trick')",e<1):'<p>Сосед просто машет рукой.</p>');
h.push('<button class="big alt" onclick="closeOv()">Назад</button>');ov(h.join(''))}
function pick(p){S.prof=p;save();hud();closeOv();pop('Профессия: '+PN[p])}
function stMenu(z){st='menu';const a=S.age,e=S.en,id=z.id,k=z.k,h=[`<h2>${z.n}</h2>`],wk={taxi:'taxi',office:'office',air:'pilot'}[id];
if(id==='school'){if(a<6)h.push('<p>В школу — с 6 лет.</p>');
else if(k==='desk')h.push(btn('Слушать урок','подсказок на контрольной: '+S.prep+' · 1 ⚡',"A('lesson')",e<1));
else h.push('<p>Аттестат: знания '+Math.min(S.edu,6)+'/6'+(S.edu>=6?' ✅':'')+'</p>',btn('Контрольная','3 вопроса, нужно 2 верных · 1 ⚡',"quiz('school')",e<1||S.edu>=6))}
else if(id==='uni'){const pf=S.prof;
if(a<18)h.push('<p>В университет — с 18 лет.</p>');
else if(S.edu<6)h.push('<p>Нужен аттестат: знания '+S.edu+'/6. Закончи школу (контрольные на доске).</p>');
else if(k==='dean'){if(!pf)h.push('<p>Выбери профессию. Учёба 3 года: каждый год 2 лекции (30 🪙) и экзамен.</p>',...['pilot','taxi','office'].map(p=>btn(PN[p],'поступить',"pick('"+p+"')")));else h.push('<p>Профессия: '+PN[pf]+'<br>Курсов: '+S.cr+'/3'+(S.dip?' · диплом ✅':'')+'</p>')}
else if(!pf)h.push('<p>Сначала выбери профессию в деканате.</p>');
else if(S.dip)h.push('<p>Диплом уже получен ✅</p>');
else if(k==='lect')h.push(btn('Лекция','30 🪙 · '+S.lec+'/2 в этом году · 1 ⚡',"A('lec')",e<1||S.bank<30||S.lec>=2));
else h.push(btn('Экзамен курса '+(S.cr+1),S.lec>=2?'3 вопроса, нужно 2 верных · 1 ⚡':'сначала 2 лекции в этом году',"quiz('uni')",e<1||S.lec<2))}
else if(a<18)h.push('<p>Работать можно с 18 лет.</p>');
else if(k==='hr'){if(S.dip!==wk)h.push('<p>Нужен диплом по профессии «'+PN[wk]+'». Поступи в университет.</p>');else if(S.job===wk)h.push('<p>Ты здесь работаешь ✅ Опыт: '+S.exp[wk]+'</p>');else h.push(btn('Устроиться: '+PN[wk],'оклад '+JB[wk]+' 🪙 за смену',"S.job='"+wk+"';save();hud();closeOv();pop('Тебя приняли! 🎉')"))}
else h.push(S.job===wk?btn('Выйти на смену','≈ '+pay(wk)+' 🪙 · опыт '+S.exp[wk]+' · 1 ⚡',"A('work')",e<1):'<p>Сначала устройся на работу.</p>');
h.push('<button class="big alt" onclick="closeOv()">Назад</button>');ov(h.join(''))}
let Q=null;const shf=a=>a.sort(()=>Math.random()-.5);
function quiz(kind){if(S.en<1)return;let qs=shf([...QB]).slice(0,kind==='uni'?2:3);if(kind==='uni')qs.push(shf([...PQ[S.prof]])[0]);Q={kind,qs,i:0,ok:0,hint:Math.min(S.prep,2)};S.prep=0;qshow()}
function qshow(){st='menu';const q=Q.qs[Q.i];let rem=Q.hint;const ids=shf([0,1,2]).filter(i=>{if(i!==q.c&&rem>0){rem--;return false}return true});
ov(`<h2>${Q.kind==='uni'?'Экзамен':'Контрольная'} · вопрос ${Q.i+1}/3</h2><p style="color:var(--fg);font-weight:700">${q.q}</p>`+ids.map(i=>`<button class="big alt" onclick="qans(${i})">${q.a[i]}</button>`).join(''))}
function qans(i){if(i===Q.qs[Q.i].c)Q.ok++;Q.i++;if(Q.i<3)return qshow();qend()}
function qend(){const k=Q.kind,pass=Q.ok>=2;S.en--;let m;
if(pass){if(k==='school'){S.edu=Math.min(6,S.edu+1);S.trust=Math.min(100,S.trust+3);m='Сдано! Знания: '+S.edu+'/6'}else{S.cr++;S.lec=0;if(S.cr>=3){S.dip=S.prof;m='🎓 Диплом: '+PN[S.prof]+'!'}else m='Курс '+S.cr+'/3 пройден!'}}else m='Не сдано. Попробуй ещё раз.';
save();hud();ov(`<h2>${Q.ok}/3 — ${pass?'отлично':'не сдано'}</h2><p>${m}</p><button class="big" onclick="closeOv();if(S.en<=0)yearEnd()">Ок</button>`)}
function A(n){if(S.en<1)return;const fn={
ask:()=>{if(Math.random()<S.trust/100*.8+.1){const g=rnd(3,8);S.bank+=g;S.trust=Math.max(0,S.trust-4);return'Мама дала +'+g+' 🪙'}S.trust=Math.max(0,S.trust-2);return'«Сейчас нет, милый»'},
steal:()=>{if(Math.random()<.45){const l=Math.min(S.bank,15);S.bank-=l;S.trust=Math.max(0,S.trust-20);return'Поймали! −'+l+' 🪙, доверие упало'}const g=rnd(10,20);S.bank+=g;S.trust=Math.max(0,S.trust-6);return'Тихо взял +'+g+' 🪙'},
trick:()=>{if(Math.random()<.3){const l=Math.min(S.bank,10);S.bank-=l;S.trust=Math.max(0,S.trust-8);return'Обман раскрыт! −'+l+' 🪙'}const g=rnd(8,16);S.bank+=g;return'Камень продан +'+g+' 🪙'},
lesson:()=>{S.prep=Math.min(2,S.prep+1);return'Подсказок на контрольной: '+S.prep},
lec:()=>{S.bank-=30;S.lec++;return'Лекция прослушана '+S.lec+'/2'},
work:()=>{const p=pay(S.job);S.bank+=p;S.exp[S.job]++;return'Смена: +'+p+' 🪙'}}[n];
$('ov').style.display='none';st='act';setTimeout(()=>{const r=fn();S.en--;save();hud();pop(r);st='play';if(S.en<=0)setTimeout(yearEnd,900)},1200)}
let wc='hat';
function ward(c){c=c||wc;wc=c;st='ward';let tb='<div class="tabs">',ls='';for(const k in CATS)tb+=`<button class="${k===c?'on':''}" onclick="ward('${k}')">${CATS[k]}</button>`;tb+='</div>';
for(const i of ITEMS.filter(x=>x.c===c)){const own=S.own.includes(i.id),eq=S.eq[c]===i.id,col=i.col!==undefined?'#'+i.col.toString(16).padStart(6,'0'):'transparent';
ls+=`<div class="it"><span class="sw" style="background:${col}"></span><b>${i.n}</b>`+(eq?'<button disabled>Надето</button>':own?`<button onclick="eqp('${i.id}')">Надеть</button>`:`<button ${S.bank<i.p?'disabled':''} onclick="buy('${i.id}')">${i.p} 🪙</button>`)+'</div>'}
ov(`<h2>Гардероб · 🪙 ${S.bank}</h2>${tb}${ls}<button class="big alt" onclick="closeOv()">Готово</button>`)}
const buy=id=>{const i=gI(id);if(S.bank<i.p)return;S.bank-=i.p;S.own.push(id);S.eq[i.c]=id;save();dress();hud();ward(i.c)},eqp=id=>{const i=gI(id);S.eq[i.c]=id;save();dress();ward(i.c)};

// ---- controls ----
const jy=$('joy'),kn=$('knob');let jid=null;
function jm(e){const r=jy.getBoundingClientRect();let dx=e.clientX-r.left-65,dy=e.clientY-r.top-65;const m=Math.hypot(dx,dy);if(m>45){dx*=45/m;dy*=45/m}jx=dx/45;jz=dy/45;kn.style.transform=`translate(${dx}px,${dy}px)`}
jy.addEventListener('pointerdown',e=>{jid=e.pointerId;jy.setPointerCapture(jid);jm(e)});jy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const je=e=>{if(e.pointerId===jid){jid=null;jx=jz=0;kn.style.transform=''}};jy.addEventListener('pointerup',je);jy.addEventListener('pointercancel',je);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e'&&near&&st==='play')inter(near)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
$('act').addEventListener('pointerdown',e=>{e.preventDefault();if(near&&st==='play')inter(near)});
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?70:55;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();

let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;tm+=dt;
const p=pl.g.position;let mv=false;
if(st==='play'&&S.age>=5){let vx=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),vz=jz+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const l=Math.hypot(vx,vz);
if(l>.15){mv=true;const k=Math.min(1,l)*(5+S.age*.1)*dt/l;p.x+=vx*k;p.z+=vz*k;facing=Math.atan2(-vx,-vz)}}
if(!where)for(const z of Z)if(z.id!=='npc'){const dx=p.x-z.x,dz=p.z-z.z,d=Math.hypot(dx,dz);if(d<5.4){p.x=z.x+dx/d*5.4;p.z=z.z+dz/d*5.4}}
{const c=where?INB[where]:0,w=where?9:60,zn=where?-8:-55,zx=where?8.5:55;p.x=Math.max(c-w,Math.min(c+w,p.x));p.z=Math.max(zn,Math.min(zx,p.z))}
let d=((facing-pl.g.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;pl.g.rotation.y+=d*Math.min(1,dt*12);
anim(pl,tm,st==='act'?'work':mv?'walk':'idle');anim(mom,tm+1,'idle');anim(dad,tm+2,'idle');anim(kid,tm,'idle');
car.position.set(((tm*9)%130)-65,0,11.5);const ang=tm*.25;plane.position.set(Math.cos(ang)*38,16,Math.sin(ang)*38);plane.rotation.set(0,Math.atan2(-Math.sin(ang),Math.cos(ang)),.25);
near=null;if(st==='play'&&S.age>=5){let b=9;const L=where?INZ.filter(q=>q.id===where):Z;for(const z of L){const q=Math.hypot(p.x-z.x,p.z-z.z),r=z.st?(z.k==='exit'?2.6:3.2):z.id==='npc'?3.5:8;if(q<r&&q<b){b=q;near=z}}}
const a=$('act');a.style.display=near?'block':'none';if(near)a.textContent=near.st?(near.k==='exit'?'🚪 Выйти':'🛠 '+near.n):near.id==='npc'?'💬 Поговорить':near.id==='home'?'🏠 Дом':'🚪 Войти: '+near.n;
let tx,ty,tz,lx,ly,lz;
if(st==='ward'){tx=p.x;ty=1.5;tz=p.z-3.4;lx=p.x;ly=.15;lz=p.z;pl.g.rotation.y=Math.sin(tm)*.6}
else{off+=((st==='menu'||st==='story'?3.2:0)-off)*Math.min(1,dt*4);tx=p.x;ty=9.5;tz=p.z+9.5+off;lx=p.x;ly=0;lz=p.z+off}
cx+=(tx-cx)*Math.min(1,dt*6);cz+=(tz-cz)*Math.min(1,dt*6);cam.position.set(cx,ty,cz);cam.lookAt(lx,ly,lz);
R.render(sc,cam)}
$('hud').style.display='block';jy.style.display='block';dress();grow();hud();flow();requestAnimationFrame(loop);
</script></body></html>
